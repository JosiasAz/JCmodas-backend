# Publica a API no servidor a cada push na main (ou pelo botão "Run workflow" na aba Actions).
# Configuração única: veja "Publicação automática" no README.md.
name: Publicar no servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

# um envio por vez: dois pushes seguidos não atualizam o servidor ao mesmo tempo
concurrency:
  group: publicar-servidor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conferir:
    name: Conferir se o código abre
    runs-on: ubuntu-latest
    steps:
      # actions fixadas pelo commit (a tag pode ser movida; o commit não)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      # se faltar import ou tiver erro de sintaxe, para aqui e o servidor continua com a versão anterior
      - run: python -c "import app.main"

  publicar:
    name: Atualizar o servidor
    needs: conferir
    runs-on: ubuntu-latest
    # os segredos (VPS_*) e a variável API_URL estão cadastrados neste ambiente do GitHub
    # (Settings > Environments > VPS_HOST); sem esta linha o job não enxerga nenhum deles
    environment: VPS_HOST
    steps:
      # só para pegar o deploy/known_hosts (identidade pública do servidor)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: deploy

      - name: Preparar acesso SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # tr -d '\r': texto colado a partir do Windows vem com CRLF, e o SSH não aceita as linhas assim
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null || {
            echo "::error::VPS_SSH_KEY vazio ou com conteúdo errado. Cole de novo a chave privada inteira (jcmoda_deploy)."
            exit 1
          }
          # identidade do servidor fixada no repositório: se alguém se passar pelo servidor, a conexão é recusada
          cp deploy/known_hosts ~/.ssh/known_hosts

      - name: Rodar a atualização no servidor
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # publica exatamente o commit que passou na conferência, não "o que estiver na main agora"
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          # espaço ou quebra de linha colados junto com o valor fariam o host não bater com o known_hosts
          host=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          # no servidor, esta chave só roda /usr/local/bin/jcmoda-deploy (deploy/jcmoda-deploy):
          # ele aceita apenas "deploy <commit da main>" e chama o deploy/atualizar.sh
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$user@$host" "deploy $DEPLOY_SHA"

      - name: Conferir a API pela internet
        env:
          API_URL: ${{ vars.API_URL }}
        if: env.API_URL != ''
        run: curl -fsS --retry 5 --retry-delay 3 "$API_URL/api/health"
