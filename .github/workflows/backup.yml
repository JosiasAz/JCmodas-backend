# Cópia diária do banco (snapshot do Neon), guardada fora da branch: se a branch for apagada
# ou os dados estragarem, dá para restaurar em Neon > Backup & restore.
# O plano grátis não tem agendamento próprio de snapshot, então quem agenda é o GitHub.
# Configuração única: secret NEON_API_KEY (Neon > Settings > API keys, de preferência
# uma chave restrita ao projeto JC-modas) em Settings > Secrets and variables > Actions.
name: Backup diário do banco

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 03:00 em Manaus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Criar snapshot no Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT: bold-scene-38333750 # JC-modas
          BRANCH: br-holy-field-b6hmjt1t # production
        run: |
          [ -n "$NEON_API_KEY" ] || { echo "::error::Falta o secret NEON_API_KEY."; exit 1; }
          name="diario-$(date -u +%Y-%m-%d)"
          expires=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ) # cada cópia se apaga sozinha em 14 dias
          curl -fsS -X POST -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$PROJECT/branches/$BRANCH/snapshot?name=$name&expires_at=$expires" \
            | python3 -c "import json,sys; s=json.load(sys.stdin)['snapshot']; print('snapshot criado:', s['id'], s['name'])"
